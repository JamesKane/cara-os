# Negative test: user-defined LVO doesn't follow the bias arithmetic.
# The first user row should be -30 but is -42.

##library    bad.library
##base       BadBase
##base_type  BadBase
##bias       30
##owner      bad
##spdx       BSD-2-Clause

Open    ULONG  (n:STRPTR, v:ULONG)  -6     syscall   Croi_Open
Close   void   ()                   -12    syscall   Croi_Close
Expunge void   ()                   -18    local     Croi_Expunge
ExtFunc void   ()                   -24    local     Croi_X
Foo     void   ()                   -42    local     Bad_Foo
