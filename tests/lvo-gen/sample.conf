# SPDX-License-Identifier: BSD-2-Clause
#
# Synthetic .conf exercising all three flavours — used by the
# B5 hosted unit tests to validate lvo-gen's parser, validator,
# and emitters against checked-in golden files.

##library    sample.library
##base       SampleBase
##base_type  SampleBase
##bias       30
##owner      sample
##spdx       BSD-2-Clause

# Reserved 0..3
Open          ULONG         (libname:STRPTR, version:ULONG)                         -6     syscall    Croi_Sample_Open
Close         void          ()                                                      -12    syscall    Croi_Sample_Close
Expunge       void          ()                                                      -18    local      Croi_Sample_Expunge
ExtFunc       void          ()                                                      -24    local      Croi_LvoUnimplemented

# User-defined slots
PingLocal     ULONG         (a:ULONG, b:ULONG)                                      -30    local      Sample_PingLocal
GetTimeOfDay  void          (out:ULONG*)                                            -36    syscall    Croi_Sample_GetTimeOfDay
SubmitJob     ULONG         (job:APTR, flags:ULONG)                                 -42    server     SampleSrv::SubmitJob
_PAD          void          ()                                                      -48    local      Croi_LvoUnimplemented
SharedAlias1  ULONG         (x:ULONG)                                               -54    syscall    Croi_Sample_SharedImpl
SharedAlias2  ULONG         (x:ULONG)                                               -60    syscall    Croi_Sample_SharedImpl
