# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS intuition.library .conf — V36+ intuition.library function table.
#
# Phase 1 implements the subset a U-mode Clar needs to run on the
# boot-opened Workbench screen: window open/close, gadget attach/detach,
# and string-gadget activation. Everything else is ##pad_run filling the
# canonical V36+ LVO slots with Croi_LvoUnimplemented. The implemented
# rows are `syscall` flavour — each points at a trampoline in
# src/croi/intuition_lib/trampolines.S that ecalls into Croi; the
# dispatcher (src/croi/syscall/syscall.c) routes the SYS_* (cara/sysno.h)
# to the matching Croi_*_Impl bridge onto the Leargas_* substrate.
#
# LVO offsets are the canonical V36+ values from intuition_lib.fd /
# the 3rd Edition autodocs (OpenWindow -204, CloseWindow -72, AddGadget
# -42, RemoveGadget -228, ActivateGadget -462). The generator validates
# lvo == -(bias + ordinal_within_user_space * 6), so the ##pad_run counts
# below keep declaration order aligned with these anchors.

##library    intuition.library
##base       IntuitionBase
##base_type  IntuitionBase
##bias       30
##owner      croi/intuition_lib
##spdx       BSD-2-Clause
##include    <intuition/intuitionbase.h>
##include    <intuition/intuition.h>
##include    <intuition/screens.h>
##include    <utility/tagitem.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local      Croi_Intuition_Open
Close    void              (base:struct Library *)   -12  local      Croi_Intuition_Close
Expunge  void              (base:struct Library *)   -18  local      Croi_Intuition_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local      Croi_Intuition_ExtFunc

# ---- LVOs -30..-36 (ord 4..5) — pad before AddGadget -----------------
##pad_run 2

# ---- AddGadget at LVO -42 (ord 6) ------------------------------------
AddGadget   UWORD  (window:struct Window *, gadget:struct Gadget *, position:ULONG)  -42   syscall   Cara_Trampoline_AddGadget

# ---- LVO -48 (ord 7) — pad (ClearDMRequest) -------------------------
##pad_run 1

# ---- ClearMenuStrip at LVO -54 (ord 8) ------------------------------
# L5.3. Detach the window's menu strip.
ClearMenuStrip  void  (window:struct Window *)  -54  syscall  Cara_Trampoline_ClearMenuStrip

# ---- LVOs -60..-66 (ord 9..10) — pad before CloseWindow -------------
# (ClearPointer, CloseScreen)
##pad_run 2

# ---- CloseWindow at LVO -72 (ord 11) ---------------------------------
CloseWindow  void  (window:struct Window *)  -72   syscall   Cara_Trampoline_CloseWindow

# ---- LVOs -78..-138 (ord 12..22) — pad before ItemAddress ----------
##pad_run 11

# ---- ItemAddress at LVO -144 (ord 23) ------------------------------
# L5.3. Resolve a packed menu number to its MenuItem.
ItemAddress  struct MenuItem *  (menuStrip:struct Menu *, menuNumber:UWORD)  -144  syscall  Cara_Trampoline_ItemAddress

# ---- ModifyIDCMP at LVO -150 (ord 24) -------------------------------
# L5.1. Set the window's IDCMP class mask (syscall).
ModifyIDCMP  void  (window:struct Window *, flags:ULONG)  -150  syscall  Cara_Trampoline_ModifyIDCMP

# ---- LVOs -156..-162 (ord 25..26) — pad before MoveWindow ----------
##pad_run 2

# ---- MoveWindow at LVO -168 (ord 27) -------------------------------
# L5.2. Move the window by (dx, dy); recomputes the window RPort.
MoveWindow  void  (window:struct Window *, dx:WORD, dy:WORD)  -168  syscall  Cara_Trampoline_MoveWindow

# ---- LVOs -174..-198 (ord 28..32) — pad before OpenWindow ----------
# (OpenScreen at -198; apps use the boot screen until L5.6)
##pad_run 5

# ---- OpenWindow at LVO -204 (ord 33) ---------------------------------
OpenWindow   struct Window *  (newWindow:struct NewWindow *)  -204  syscall  Cara_Trampoline_OpenWindow

# ---- LVOs -210..-222 (ord 34..36) — pad before RemoveGadget ----------
# (OpenWorkBench, PrintIText, RefreshGadgets)
##pad_run 3

# ---- RemoveGadget at LVO -228 (ord 37) -------------------------------
RemoveGadget  UWORD  (window:struct Window *, gadget:struct Gadget *)  -228  syscall  Cara_Trampoline_RemoveGadget

# ---- LVOs -234..-258 (ord 38..42) — pad before SetMenuStrip --------
##pad_run 5

# ---- SetMenuStrip at LVO -264 (ord 43) -----------------------------
# L5.3. Attach a menu strip to the window (lays out the bar + dropdowns).
SetMenuStrip  void  (window:struct Window *, menu:struct Menu *)  -264  syscall  Cara_Trampoline_SetMenuStrip

# ---- LVO -270 (ord 44) — pad before SetWindowTitles ----------------
##pad_run 1

# ---- SetWindowTitles at LVO -276 (ord 45) --------------------------
# L5.2. Retitle the window/screen-title (sentinel (STRPTR)-1 = unchanged).
SetWindowTitles  void  (window:struct Window *, windowTitle:STRPTR, screenTitle:STRPTR)  -276  syscall  Cara_Trampoline_SetWindowTitles

# ---- LVO -282 (ord 46) — pad (InitArea is graphics, not here) -------
##pad_run 1

# ---- SizeWindow at LVO -288 (ord 47) -------------------------------
# L5.2. Resize by (dx, dy), clamped to Min/Max; recomputes the RPort.
SizeWindow  void  (window:struct Window *, dx:WORD, dy:WORD)  -288  syscall  Cara_Trampoline_SizeWindow

# ---- LVOs -294..-300 (ord 48..49) — pad ----------------------------
##pad_run 2

# ---- WindowToBack / WindowToFront (LVOs -306..-312, ord 50..51) -----
# L5.2. Reorder the window in the screen's front-to-back list.
WindowToBack   void  (window:struct Window *)  -306  syscall  Cara_Trampoline_WindowToBack
WindowToFront  void  (window:struct Window *)  -312  syscall  Cara_Trampoline_WindowToFront

# ---- LVOs -318..-444 (ord 52..73) — pad before ActivateWindow ------
##pad_run 22

# ---- ActivateWindow at LVO -450 (ord 74) ---------------------------
# L5.2. Focus the window; posts IDCMP_ACTIVE/INACTIVEWINDOW edges.
ActivateWindow  void  (window:struct Window *)  -450  syscall  Cara_Trampoline_ActivateWindow

# ---- LVO -456 (ord 75) — pad before ActivateGadget -----------------
##pad_run 1

# ---- ActivateGadget at LVO -462 (ord 76, V36+) -----------------------
ActivateGadget  BOOL  (gadget:struct Gadget *, window:struct Window *, requester:struct Requester *)  -462  syscall  Cara_Trampoline_ActivateGadget

# ---- LVOs -468..-600 (ord 77..99) — pad before OpenWindowTagList -----
##pad_run 23

# ---- OpenWindowTagList at LVO -606 (ord 100, V36+) ------------------
# L5.1. The tag window opener — builds a NewWindow from WA_* tags and
# calls Leargas_OpenWindow (docs/LEARGAS_INTUITION.md §2.1). The varargs
# OpenWindowTags form is a header inline over this.
OpenWindowTagList  struct Window *  (newWindow:struct NewWindow *, tagList:struct TagItem *)  -606  syscall  Cara_Trampoline_OpenWindowTagList
