# ---- BOOPSI (L7) ---------------------------------------------------
# The class/object machinery (docs/LEARGAS_BOOPSI.md). Dispatch is local
# (U-mode): a class's dispatcher is arbitrary U-mode code the S-mode
# kernel can't call, so NewObjectA/DisposeObject/MakeClass/FreeClass are
# `local` — impls in src/croi/intuition_lib/boopsi.c (.lib_text.intuition),
# allocating via inlined AllocVec/FreeVec ecalls. FindClass is `syscall`
# over the kernel class registry (boopsi_registry.c). Offsets are the
# canonical intuition_lib.fd values. DoMethod/DoSuperMethod/CoerceMethod
# are amiga.lib (libcara), not LVOs.

# ---- LVOs -618..-630 (ord 102..104) — pad --------------------------
##pad_run 3

# ---- NewObjectA / DisposeObject (LVOs -636..-642, ord 105..106) -----
# L7.1. NewObjectA resolves the class then OM_NEWs it; DisposeObject
# OM_DISPOSEs the object's own class.
NewObjectA     APTR             (classPtr:struct IClass *, classID:ClassID, tagList:struct TagItem *)  -636  local  Croi_Intuition_NewObjectA
DisposeObject  void             (object:APTR)  -642  local  Croi_Intuition_DisposeObject

# ---- SetAttrsA / GetAttr / SetGadgetAttrsA / NextObject ------------
# (LVOs -648..-666, ord 107..110). L7.2 — attributes + object lists.
# All `local`: SetAttrsA/GetAttr/SetGadgetAttrsA OM_SET/OM_GET-dispatch
# to the object's U-mode class; NextObject steps an OM_ADDTAIL list.
SetAttrsA       ULONG  (object:APTR, tagList:struct TagItem *)  -648  local  Croi_Intuition_SetAttrsA
GetAttr         ULONG  (attrID:ULONG, object:APTR, storagePtr:IPTR *)  -654  local  Croi_Intuition_GetAttr
SetGadgetAttrsA ULONG  (gadget:struct Gadget *, window:struct Window *, requester:struct Requester *, tagList:struct TagItem *)  -660  local  Croi_Intuition_SetGadgetAttrsA
NextObject      APTR   (objectPtrPtr:APTR)  -666  local  Croi_Intuition_NextObject

# ---- FindClass at LVO -672 (ord 111) -------------------------------
# L7.1. The public class registry read (rootclass pre-registered at boot;
# AddClass publishes user classes in L7.3). Private in AmigaOS; CaraOS
# exposes it as the by-name resolver NewObjectA/MakeClass use.
FindClass      struct IClass *  (classID:ClassID)  -672  syscall  Cara_Trampoline_FindClass

# ---- MakeClass at LVO -678 (ord 112) -------------------------------
# L7.1. Build an IClass in the shared heap; caller fills cl_Dispatcher.
MakeClass      struct IClass *  (classID:ClassID, superClassID:ClassID, superClassPtr:struct IClass *, instanceSize:ULONG, flags:ULONG)  -678  local  Croi_Intuition_MakeClass

# ---- LVOs -684..-708 (ord 113..117) — pad -------------------------
# AddClass -684 + the V36 pub-screen/draw-info calls + RemoveClass -708
# arrive in L7.3.
##pad_run 5

# ---- FreeClass at LVO -714 (ord 118) -------------------------------
# L7.1. Release a class; refuses while objects/subclasses are live.
FreeClass      BOOL             (classPtr:struct IClass *)  -714  local  Croi_Intuition_FreeClass
