# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS diskfont.library .conf — V36+ diskfont.library function table.
# Design: docs/DISKFONT.md. diskfont loads a font from disk into a
# graphics struct TextFont so graphics.library renders it (the Dath strike
# path, L12.1). The font lives as a CaraOS-native Cara font file under
# FONTS: (a flat bitmap strike, not a 68k hunk). The loading LVOs are
# `syscall`: each points at a trampoline in src/croi/diskfont/trampolines.S
# that ecalls into Croi; the dispatcher (src/croi/syscall/syscall.c) routes
# the SYS_Diskfont_* (cara/sysno.h) to the matching Croi_Diskfont_*_Impl,
# which reads the file via the dos bridge and keeps the TextFont in the
# SASOS shared heap.
#
# This is L12.2: the library + OpenDiskFont. AvailFonts / NewFontContents /
# DisposeFontContents arrive in L12.3 and NewScaledDiskFont stays a stub;
# they split the pad below.
#
# LVO offsets are the canonical V36+ values from diskfont_lib.fd
# (cross-check amiga_docs/, never copy). The generator validates lvo ==
# -(bias + user_idx*6).

##library    diskfont.library
##base       DiskfontBase
##base_type  DiskfontBase
##bias       30
##owner      croi/diskfont
##spdx       BSD-2-Clause
##include    <libraries/diskfont.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Diskfont_Open
Close    void              (base:struct Library *)   -12  local   Croi_Diskfont_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Diskfont_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Diskfont_ExtFunc

# ---- OpenDiskFont at LVO -30 (user_idx 0) ----------------------------
# L12.2. Load FONTS:<name>/<ysize> → struct TextFont (FPF_DISKFONT).
OpenDiskFont  struct TextFont *  (textAttr:struct TextAttr *)  -30  syscall  Cara_Trampoline_Diskfont_OpenDiskFont

# ---- LVOs -36..-54 (user_idx 1..4) — pad -----------------------------
# AvailFonts -36 / NewFontContents -42 / DisposeFontContents -48 (L12.3)
# + NewScaledDiskFont -54 (stub).
##pad_run 4
