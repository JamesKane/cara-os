# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS asl.library .conf — V36+ asl.library function table.
# Design: docs/LEARGAS_ASL.md. asl composes the L5 modal requester core +
# the L8 gadtools kinds into the file/font/screen-mode requesters, so
# every implemented LVO is `syscall`: each points at a trampoline in
# src/croi/asl/trampolines.S that ecalls into Croi; the dispatcher
# (src/croi/syscall/syscall.c) routes the SYS_Asl_* (cara/sysno.h) to the
# matching Croi_Asl_*_Impl, which allocates the requester in the SASOS
# shared heap and (AslRequest) runs the modal loop kernel-side.
#
# This is L9.1: the library + AllocAslRequest/FreeAslRequest (+ the legacy
# FreeFileRequest). The modal AslRequest + AllocFileRequest/RequestFile
# arrive in L9.2; the surface is declared out to AslRequest (-60) with
# pads the later slices split.
#
# LVO offsets are the canonical V36+ values from asl_lib.fd (cross-check
# amiga_docs/, never copy). The generator validates lvo == -(bias +
# user_idx*6), so the ##pad_run counts keep declaration order aligned.

##library    asl.library
##base       AslBase
##base_type  AslBase
##bias       30
##owner      croi/asl
##spdx       BSD-2-Clause
##include    <libraries/asl.h>
##include    <utility/tagitem.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Asl_Open
Close    void              (base:struct Library *)   -12  local   Croi_Asl_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Asl_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Asl_ExtFunc

# ---- AllocFileRequest at LVO -30 (ord 4) — pad (L9.2) -------------
# Legacy: AllocAslRequest(ASL_FileRequest, nullptr).
##pad_run 1

# ---- FreeFileRequest at LVO -36 (ord 5) --------------------------
# L9.1. Legacy alias for FreeAslRequest.
FreeFileRequest void  (fileReq:struct FileRequester *)  -36  syscall  Cara_Trampoline_Asl_FreeFileRequest

# ---- RequestFile at LVO -42 (ord 6) — pad (L9.2) -----------------
##pad_run 1

# ---- AllocAslRequest / FreeAslRequest (LVOs -48..-54, ord 7..8) --
# L9.1. Allocate / free a requester (FileRequester / FontRequester /
# ScreenModeRequester by reqType) on the shared heap.
AllocAslRequest APTR  (reqType:ULONG, tagList:struct TagItem *)  -48  syscall  Cara_Trampoline_Asl_AllocAslRequest
FreeAslRequest  void  (requester:APTR)  -54  syscall  Cara_Trampoline_Asl_FreeAslRequest

# ---- AslRequest at LVO -60 (ord 9) — pad (L9.2) ------------------
##pad_run 1
