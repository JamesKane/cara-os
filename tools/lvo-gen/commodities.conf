# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS commodities.library .conf — V36+ commodities.library function
# table. Design: docs/COMMODITIES.md. commodities builds a tree of CxObjs
# (broker → filters/translators/senders) that the input.device handler
# chain runs InputEvents through. CaraOS L13 ships the object model + IX
# parsing; the live input dispatch is deferred (the handler chain is
# recorded-not-invoked, CROI_DEVICES §2.5). The object-model LVOs are
# `syscall`: each points at a trampoline in src/croi/commodities/
# trampolines.S that ecalls into Croi; the dispatcher (src/croi/syscall/
# syscall.c) routes the SYS_Cx_* (cara/sysno.h) to the matching
# Croi_Cx_*_Impl, which keeps the CxObj tree in the SASOS shared heap.
#
# This is L13.1: the library + the CxObj object model (the contiguous
# -30..-102 lifecycle/tree block). The input-config group (SetTranslate/
# SetFilter/SetFilterIX/ParseIX) + the CxMsg accessors arrive in L13.2 and
# split the pad below.
#
# LVO offsets are the canonical V36+ values from commodities_lib.fd
# (cross-check amiga_docs/, never copy). The generator validates lvo ==
# -(bias + user_idx*6).

##library    commodities.library
##base       CxBase
##base_type  CxBase
##bias       30
##owner      croi/commodities
##spdx       BSD-2-Clause
##include    <libraries/commodities.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Cx_Open
Close    void              (base:struct Library *)   -12  local   Croi_Cx_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Cx_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Cx_ExtFunc

# ---- CxObj object model (LVOs -30..-102, user_idx 0..12) -------------
# L13.1. Create/query/destroy + the broker tree. CxBroker is the broker
# constructor (CreateCxObj(CX_BROKER, …) with the NewBroker).
CreateCxObj     struct CxObj *  (type:ULONG, arg1:IPTR, arg2:IPTR)        -30   syscall  Cara_Trampoline_Cx_CreateCxObj
CxBroker        struct CxObj *  (nb:struct NewBroker *, error:LONG *)     -36   syscall  Cara_Trampoline_Cx_CxBroker
ActivateCxObj   LONG            (co:struct CxObj *, doactivate:LONG)      -42   syscall  Cara_Trampoline_Cx_ActivateCxObj
DeleteCxObj     void            (co:struct CxObj *)                       -48   syscall  Cara_Trampoline_Cx_DeleteCxObj
DeleteCxObjAll  void            (co:struct CxObj *)                       -54   syscall  Cara_Trampoline_Cx_DeleteCxObjAll
CxObjType       ULONG           (co:struct CxObj *)                       -60   syscall  Cara_Trampoline_Cx_CxObjType
CxObjError      LONG            (co:struct CxObj *)                       -66   syscall  Cara_Trampoline_Cx_CxObjError
ClearCxObjError void            (co:struct CxObj *)                       -72   syscall  Cara_Trampoline_Cx_ClearCxObjError
SetCxObjPri     LONG            (co:struct CxObj *, pri:LONG)             -78   syscall  Cara_Trampoline_Cx_SetCxObjPri
AttachCxObj     void            (headObj:struct CxObj *, co:struct CxObj *)  -84   syscall  Cara_Trampoline_Cx_AttachCxObj
EnqueueCxObj    void            (headObj:struct CxObj *, co:struct CxObj *)  -90   syscall  Cara_Trampoline_Cx_EnqueueCxObj
InsertCxObj     void            (headObj:struct CxObj *, co:struct CxObj *, pred:struct CxObj *)  -96   syscall  Cara_Trampoline_Cx_InsertCxObj
RemoveCxObj     void            (co:struct CxObj *)                       -102  syscall  Cara_Trampoline_Cx_RemoveCxObj

# ---- Input config + ParseIX (LVOs -108..-126, user_idx 13..16) -------
# L13.2. SetTranslate/SetFilter/SetFilterIX store config on the CxObj;
# ParseIX parses an input-description string into an InputXpression.
SetTranslate  void  (translator:struct CxObj *, events:struct InputEvent *)  -108  syscall  Cara_Trampoline_Cx_SetTranslate
SetFilter     void  (filter:struct CxObj *, text:STRPTR)                     -114  syscall  Cara_Trampoline_Cx_SetFilter
SetFilterIX   LONG  (filter:struct CxObj *, ix:struct InputXpression *)      -120  syscall  Cara_Trampoline_Cx_SetFilterIX
ParseIX       LONG  (description:STRPTR, ix:struct InputXpression *)         -126  syscall  Cara_Trampoline_Cx_ParseIX

# ---- LVOs -132..-150 (user_idx 17..20) — pad -------------------------
# AddIEvents -132 / InvertKeyMap -138 / InvertString -144 (live-input /
# keymap, stubbed) + RouteCxMsg -150 (live dispatch, stubbed).
##pad_run 4

# ---- DisposeCxMsg at LVO -156 (user_idx 21) -------------------------
# L13.2. Free a CxMsg.
DisposeCxMsg  void  (cxm:struct CxMsg *)  -156  syscall  Cara_Trampoline_Cx_DisposeCxMsg

# ---- DivertCxMsg at LVO -162 (user_idx 22) — pad (live dispatch) ----
##pad_run 1

# ---- CxMsg accessors (LVOs -168..-180, user_idx 23..25) -------------
# L13.2. Read a routed CxMsg's type / data / id.
CxMsgType  ULONG  (cxm:struct CxMsg *)  -168  syscall  Cara_Trampoline_Cx_CxMsgType
CxMsgData  APTR   (cxm:struct CxMsg *)  -174  syscall  Cara_Trampoline_Cx_CxMsgData
CxMsgID    ULONG  (cxm:struct CxMsg *)  -180  syscall  Cara_Trampoline_Cx_CxMsgID

