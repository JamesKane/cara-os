# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS gadtools.library .conf — V36+ gadtools.library function table.
# Design: docs/LEARGAS_GADTOOLS.md. gadtools builds plain struct Gadgets
# over the Leargas gadget substrate (NOT BOOPSI — §2.1), so every
# implemented LVO is `syscall` flavour: each points at a trampoline in
# src/croi/gadtools/trampolines.S that ecalls into Croi; the dispatcher
# (src/croi/syscall/syscall.c) routes the SYS_GT_* (cara/sysno.h) to the
# matching Croi_GT_*_Impl, which allocates gadget/SpecialInfo/VisualInfo
# in the SASOS shared heap and bridges onto Leargas_* + Croi_Gfx_*.
#
# This is L8.1: the library is constructed at boot with the reserved
# hooks + the render-context LVOs only (GetVisualInfoA/FreeVisualInfo,
# CreateContext/FreeGadgets). The ABI surface is declared out to
# GT_GetGadgetAttrsA (-138, the deepest LVO L8 implements); later slices
# split the pads at the right ordinals.
#
# LVO offsets are the canonical V36+ values from gadtools_lib.fd / the
# 3rd Edition autodocs (cross-check amiga_docs/, never copy). The
# generator validates lvo == -(bias + user_idx*6), so the ##pad_run
# counts keep declaration order aligned with the canonical numbers.

##library    gadtools.library
##base       GadToolsBase
##base_type  GadToolsBase
##bias       30
##owner      croi/gadtools
##spdx       BSD-2-Clause
##include    <libraries/gadtools.h>
##include    <intuition/screens.h>
##include    <intuition/intuition.h>
##include    <utility/tagitem.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_GT_Open
Close    void              (base:struct Library *)   -12  local   Croi_GT_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_GT_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_GT_ExtFunc

# ---- CreateGadgetA at LVO -30 (ord 4) — pad (L8.2) -----------------
##pad_run 1

# ---- FreeGadgets at LVO -36 (ord 5) -------------------------------
# L8.1. Walk a CreateContext/CreateGadgetA list freeing each gadget +
# its SpecialInfo. Returns nullptr (the V36 idiom).
FreeGadgets    struct Gadget *  (glist:struct Gadget *)  -36  syscall  Cara_Trampoline_GT_FreeGadgets

# ---- LVOs -42..-108 (ord 6..17) — pad ------------------------------
# GT_SetGadgetAttrsA / CreateMenusA / FreeMenus / LayoutMenuItemsA /
# LayoutMenusA / GT_GetIMsg / GT_ReplyIMsg / GT_RefreshWindow /
# GT_BeginRefresh / GT_EndRefresh / GT_FilterIMsg / GT_PostFilterIMsg
# arrive in L8.2/L8.4.
##pad_run 12

# ---- CreateContext at LVO -114 (ord 18) ---------------------------
# L8.1. Allocate the placeholder context gadget that heads a gadtools
# gadget list; *glistptr receives it and it is the CreateGadgetA seed.
CreateContext  struct Gadget *  (glistptr:struct Gadget **)  -114  syscall  Cara_Trampoline_GT_CreateContext

# ---- DrawBevelBoxA at LVO -120 (ord 19) — pad (L8.3) --------------
##pad_run 1

# ---- GetVisualInfoA / FreeVisualInfo (LVOs -126..-132, ord 20..21) -
# L8.1. A screen-derived rendering handle (struct CaraVisualInfo) on the
# shared heap; the gadget kinds read pens/font from its DrawInfo.
GetVisualInfoA APTR  (screen:struct Screen *, tagList:struct TagItem *)  -126  syscall  Cara_Trampoline_GT_GetVisualInfoA
FreeVisualInfo void  (vi:APTR)  -132  syscall  Cara_Trampoline_GT_FreeVisualInfo
