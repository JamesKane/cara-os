# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS gadtools.library .conf — V36+ gadtools.library function table.
# Design: docs/LEARGAS_GADTOOLS.md. gadtools builds plain struct Gadgets
# over the Leargas gadget substrate (NOT BOOPSI — §2.1), so every
# implemented LVO is `syscall` flavour: each points at a trampoline in
# src/croi/gadtools/trampolines.S that ecalls into Croi; the dispatcher
# (src/croi/syscall/syscall.c) routes the SYS_GT_* (cara/sysno.h) to the
# matching Croi_GT_*_Impl, which allocates gadget/SpecialInfo/VisualInfo
# in the SASOS shared heap and bridges onto Leargas_* + Croi_Gfx_*.
#
# This is L8.1: the library is constructed at boot with the reserved
# hooks + the render-context LVOs only (GetVisualInfoA/FreeVisualInfo,
# CreateContext/FreeGadgets). The ABI surface is declared out to
# GT_GetGadgetAttrsA (-138, the deepest LVO L8 implements); later slices
# split the pads at the right ordinals.
#
# LVO offsets are the canonical V36+ values from gadtools_lib.fd / the
# 3rd Edition autodocs (cross-check amiga_docs/, never copy). The
# generator validates lvo == -(bias + user_idx*6), so the ##pad_run
# counts keep declaration order aligned with the canonical numbers.

##library    gadtools.library
##base       GadToolsBase
##base_type  GadToolsBase
##bias       30
##owner      croi/gadtools
##spdx       BSD-2-Clause
##include    <libraries/gadtools.h>
##include    <intuition/screens.h>
##include    <intuition/intuition.h>
##include    <graphics/rastport.h>
##include    <exec/ports.h>
##include    <utility/tagitem.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_GT_Open
Close    void              (base:struct Library *)   -12  local   Croi_GT_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_GT_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_GT_ExtFunc

# ---- CreateGadgetA at LVO -30 (ord 4) -----------------------------
# L8.2. The gadget factory: build a struct Gadget from the kind + a
# NewGadget + GT*_* tags, chain it after prevGad over the Leargas
# substrate. v0 kinds BUTTON/TEXT/NUMBER/CHECKBOX (L8.2),
# CYCLE/MX/STRING/INTEGER (L8.3).
CreateGadgetA  struct Gadget *  (kind:ULONG, prevGad:struct Gadget *, ng:struct NewGadget *, tagList:struct TagItem *)  -30  syscall  Cara_Trampoline_GT_CreateGadgetA

# ---- FreeGadgets at LVO -36 (ord 5) -------------------------------
# L8.1. Walk a CreateContext/CreateGadgetA list freeing each gadget +
# its SpecialInfo. Returns nullptr (the V36 idiom).
FreeGadgets    struct Gadget *  (glist:struct Gadget *)  -36  syscall  Cara_Trampoline_GT_FreeGadgets

# ---- GT_SetGadgetAttrsA at LVO -42 (ord 6) ------------------------
# L8.2. Apply post-create attribute changes (GTCB_Checked / GTNM_Number /
# GTTX_Text …) then re-render if a window is supplied.
GT_SetGadgetAttrsA void  (gad:struct Gadget *, win:struct Window *, req:struct Requester *, tagList:struct TagItem *)  -42  syscall  Cara_Trampoline_GT_SetGadgetAttrsA

# ---- Menu builder + IDCMP wrap (LVOs -48..-96, ord 7..15) ---------
# L8.4. CreateMenusA/FreeMenus/LayoutMenuItemsA/LayoutMenusA build/lay
# out/tear down the L5.3 Menu chain from a NewMenu[]; GT_GetIMsg pops the
# window IDCMP message + does the gadtools-internal gadget update,
# GT_ReplyIMsg disposes it; GT_RefreshWindow/Begin/EndRefresh re-render.
CreateMenusA      struct Menu *  (newmenu:struct NewMenu *, tagList:struct TagItem *)  -48  syscall  Cara_Trampoline_GT_CreateMenusA
FreeMenus         void           (menu:struct Menu *)  -54  syscall  Cara_Trampoline_GT_FreeMenus
LayoutMenuItemsA  BOOL           (firstItem:struct MenuItem *, vi:APTR, tagList:struct TagItem *)  -60  syscall  Cara_Trampoline_GT_LayoutMenuItemsA
LayoutMenusA      BOOL           (menu:struct Menu *, vi:APTR, tagList:struct TagItem *)  -66  syscall  Cara_Trampoline_GT_LayoutMenusA
GT_GetIMsg        struct IntuiMessage *  (iport:struct MsgPort *)  -72  syscall  Cara_Trampoline_GT_GetIMsg
GT_ReplyIMsg      void           (imsg:struct IntuiMessage *)  -78  syscall  Cara_Trampoline_GT_ReplyIMsg
GT_RefreshWindow  void           (win:struct Window *, req:struct Requester *)  -84  syscall  Cara_Trampoline_GT_RefreshWindow
GT_BeginRefresh   void           (win:struct Window *)  -90  syscall  Cara_Trampoline_GT_BeginRefresh
GT_EndRefresh     void           (win:struct Window *, complete:LONG)  -96  syscall  Cara_Trampoline_GT_EndRefresh

# ---- LVOs -102..-108 (ord 16..17) — pad ---------------------------
# GT_FilterIMsg / GT_PostFilterIMsg (raw filter hooks) — folded into
# GT_GetIMsg in v0; declared, stubbed.
##pad_run 2

# ---- CreateContext at LVO -114 (ord 18) ---------------------------
# L8.1. Allocate the placeholder context gadget that heads a gadtools
# gadget list; *glistptr receives it and it is the CreateGadgetA seed.
CreateContext  struct Gadget *  (glistptr:struct Gadget **)  -114  syscall  Cara_Trampoline_GT_CreateContext

# ---- DrawBevelBoxA at LVO -120 (ord 19) --------------------------
# L8.3. A raised/recessed bevel box over a RastPort (shine/shadow edges).
DrawBevelBoxA  void  (rport:struct RastPort *, left:WORD, top:WORD, width:WORD, height:WORD, tagList:struct TagItem *)  -120  syscall  Cara_Trampoline_GT_DrawBevelBoxA

# ---- GetVisualInfoA / FreeVisualInfo (LVOs -126..-132, ord 20..21) -
# L8.1. A screen-derived rendering handle (struct CaraVisualInfo) on the
# shared heap; the gadget kinds read pens/font from its DrawInfo.
GetVisualInfoA APTR  (screen:struct Screen *, tagList:struct TagItem *)  -126  syscall  Cara_Trampoline_GT_GetVisualInfoA
FreeVisualInfo void  (vi:APTR)  -132  syscall  Cara_Trampoline_GT_FreeVisualInfo

# ---- GT_GetGadgetAttrsA at LVO -138 (ord 22, V39) ----------------
# L8.3. Read back a gadget's kind attributes into caller storage.
GT_GetGadgetAttrsA ULONG  (gad:struct Gadget *, win:struct Window *, req:struct Requester *, tagList:struct TagItem *)  -138  syscall  Cara_Trampoline_GT_GetGadgetAttrsA
