# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS utility.library .conf — V36+ utility.library function table.
#
# utility.library is pure, base-less helper code: tag-list walkers and
# the Hook dispatcher. Every implemented LVO is `local` flavour — the
# impl is self-contained pointer arithmetic on the caller's SASOS-
# resident TagItem array / Hook (no kernel state, no syscall), so it
# lives in the .lib_text.utility RX page at 0x4000_0000 (LVO.md §5.1)
# alongside the impls in src/croi/utility_lib/tag_ops.c. The proto stub
# JALRs straight to it; there is no trap.
#
# Slots we don't implement yet (the allocating tag helpers, the date /
# math / string functions) are explicit ##pad_run rows pointing at
# Croi_LvoUnimplemented, so every real function's runtime ordinal stays
# frozen as the surface fills in (see docs/LVO_COVERAGE.md).
#
# LVO offsets are the canonical V36+ values from utility_lib.fd / the
# 3rd Edition autodocs. The generator validates
# lvo == -(bias + user_index*6), so the ##pad_run counts keep
# declaration order aligned with these anchors.

##library    utility.library
##base       UtilityBase
##base_type  UtilityBase
##bias       30
##owner      croi/utility_lib
##spdx       BSD-2-Clause
##include    <utility/tagitem.h>
##include    <utility/hooks.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local      Croi_Utility_Open
Close    void              (base:struct Library *)   -12  local      Croi_Utility_Close
Expunge  void              (base:struct Library *)   -18  local      Croi_Utility_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local      Croi_Utility_ExtFunc

# ---- Tag-list walkers (LVOs -30..-60, ord 4..9) ----------------------
# The pure, apps-used core. All `local`; impls in tag_ops.c.
FindTagItem   struct TagItem *  (tagValue:Tag, tagList:struct TagItem *)                       -30  local  Croi_Utility_FindTagItem
GetTagData    IPTR              (tagValue:Tag, defaultVal:IPTR, tagList:struct TagItem *)       -36  local  Croi_Utility_GetTagData
PackBoolTags  ULONG             (initialFlags:ULONG, tagList:struct TagItem *, boolMap:struct TagItem *)  -42  local  Croi_Utility_PackBoolTags
NextTagItem   struct TagItem *  (tagItemPtr:struct TagItem **)                                 -48  local  Croi_Utility_NextTagItem

# ---- FilterTagChanges / MapTags (LVOs -54..-60, ord 8..9) -----------
# Pure in-place tag-list transforms (slice 2); both `local`.
FilterTagChanges void           (changeList:struct TagItem *, originalList:struct TagItem *, apply:BOOL)  -54  local  Croi_Utility_FilterTagChanges
MapTags          void           (tagList:struct TagItem *, mapList:struct TagItem *, mapType:ULONG)       -60  local  Croi_Utility_MapTags

# ---- Allocating tag helpers (LVOs -66..-84, ord 10..13) -------------
# These allocate, so unlike the walkers they can't be `local` — they are
# `syscall` flavour (trampolines in src/croi/utility_lib/trampolines.S →
# Croi_Utility_*_Impl in tag_alloc.c, backed by the SASOS shared heap).
AllocateTagItems     struct TagItem *  (numTags:ULONG)                                       -66  syscall  Cara_Trampoline_AllocateTagItems
CloneTagItems        struct TagItem *  (tagList:struct TagItem *)                            -72  syscall  Cara_Trampoline_CloneTagItems
FreeTagItems         void              (tagList:struct TagItem *)                            -78  syscall  Cara_Trampoline_FreeTagItems
RefreshTagItemClones void              (clone:struct TagItem *, original:struct TagItem *)   -84  syscall  Cara_Trampoline_RefreshTagItemClones

# ---- TagInArray at LVO -90 (ord 14) ----------------------------------
TagInArray    BOOL              (tagValue:Tag, tagArray:Tag *)                                 -90  local  Croi_Utility_TagInArray

# ---- FilterTagItems at LVO -96 (ord 15) ------------------------------
# In-place filter/compaction over a flat tag list; returns kept count.
FilterTagItems ULONG            (tagList:struct TagItem *, filterArray:Tag *, logic:ULONG)     -96  local  Croi_Utility_FilterTagItems

# ---- CallHookPkt at LVO -102 (ord 16) --------------------------------
CallHookPkt   ULONG             (hook:struct Hook *, object:APTR, paramPacket:APTR)            -102 local  Croi_Utility_CallHookPkt

# ---- LVOs -108..-180 (ord 17..29) — pad ------------------------------
# Two reserved private slots, then the V37 date/math/string functions
# (Amiga2Date, Date2Amiga, CheckDate, SMult32, UMult32, SDivMod32,
# UDivMod32, Stricmp, Strnicmp, ToUpper, ToLower) — declared as stubs.
##pad_run 13
