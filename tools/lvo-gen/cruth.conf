# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS cruth.library .conf — Cara-native 3D API LVO table.
#
# See docs/CRUTH.md for the design spec and docs/LVO.md for the .conf
# format. cruth.library has no AmigaOS V36+ canonical analogue; per
# PRINCIPLES.md §3.1 the verbatim-name rule does not apply, so the
# function names below are Cara-native.
#
# Flavours follow the IPC budget in CRUTH.md §"Draw loop":
#
#   - Make*/Free/Update*/Present are flavour=server. They cross the
#     library/Gleas seam (GPU resource allocation, microcode compile,
#     vsync flush). The receiving Gleas is named Cruth_Server in the
#     impl-symbol field.
#
#   - Begin/End/Bind*/Draw*/PushConstants are flavour=local. They
#     append to a per-task client-side command buffer kept in
#     library-private state, so the hot path pays no IPC. Only
#     Present (one PutMsg per frame) crosses the seam.
#
# Reserved 0..3 (Open/Close/Expunge/ExtFunc) are local-flavour stubs
# in src/croi/cruth/cruth_hooks.c (TBD with Cruth-C). The per-task
# client-side ring is allocated by the Open hook and freed in Close.

##library    cruth.library
##base       CruthBase
##base_type  CruthBase
##bias       30
##owner      croi/cruth
##spdx       BSD-2-Clause
##include    <cruth/cruth.h>
##include    <utility/tagitem.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)                                      -6    local      Croi_Cruth_Open
Close    void              (base:struct Library *)                                      -12   local      Croi_Cruth_Close
Expunge  void              (base:struct Library *)                                      -18   local      Croi_Cruth_Expunge
ExtFunc  ULONG             (base:struct Library *)                                      -24   local      Croi_Cruth_ExtFunc

# ---- Resource creation / lifecycle (server flavour, LVOs -30..-78) --
#
# Each Make* call allocates GPU memory or descriptor state in the
# Cruth Gleas; Free releases it; Update* writes data through the Gleas
# (cache-flush-aware on hardware, plain memcpy on Sciath).

MakeBuffer        Cruth_Handle  (usage:ULONG, size:ULONG, init_data:APTR)               -30   server     Cruth_Server::MakeBuffer
MakeTexture       Cruth_Handle  (tags:struct TagItem *)                                 -36   server     Cruth_Server::MakeTexture
MakeSampler       Cruth_Handle  (tags:struct TagItem *)                                 -42   server     Cruth_Server::MakeSampler
MakeShader        Cruth_Handle  (spirv:APTR, len:ULONG, flags:ULONG)                    -48   server     Cruth_Server::MakeShader
MakePipeline      Cruth_Handle  (tags:struct TagItem *)                                 -54   server     Cruth_Server::MakePipeline
MakeRenderTarget  Cruth_Handle  (tags:struct TagItem *)                                 -60   server     Cruth_Server::MakeRenderTarget
Free              void          (h:Cruth_Handle)                                        -66   server     Cruth_Server::Free
UpdateBuffer      void          (h:Cruth_Handle, offset:ULONG, src:APTR, size:ULONG)    -72   server     Cruth_Server::UpdateBuffer
UpdateTexture     void          (h:Cruth_Handle, region:struct CruthTextureRegion *, src:APTR) -78   server     Cruth_Server::UpdateTexture

# ---- Frame and draw loop (local flavour, LVOs -84..-132) ------------
#
# All append commands to the per-task client-side command buffer
# in library-private state. Begin opens a frame; End closes it; in
# between, Bind* update binding state and Draw* emit primitives.
# PushConstants writes up to CRUTH_MAX_PUSH_CONST bytes inline into
# the cmdbuf for the next draw.

Begin             void          (rt:Cruth_Handle)                                       -84   local      Cruth_Begin
End               void          ()                                                      -90   local      Cruth_End
Bind              void          (pipe:Cruth_Handle)                                     -96   local      Cruth_Bind
BindBuffer        void          (slot:UWORD, buf:Cruth_Handle)                          -102  local      Cruth_BindBuffer
BindTexture       void          (slot:UWORD, tex:Cruth_Handle)                          -108  local      Cruth_BindTexture
BindSampler       void          (slot:UWORD, samp:Cruth_Handle)                         -114  local      Cruth_BindSampler
PushConstants     void          (data:APTR, size:ULONG)                                 -120  local      Cruth_PushConstants
Draw              void          (vbuf:Cruth_Handle, first:ULONG, count:ULONG)           -126  local      Cruth_Draw
DrawIndexed       void          (vbuf:Cruth_Handle, ibuf:Cruth_Handle, first:ULONG, count:ULONG) -132 local Cruth_DrawIndexed

# ---- Submission (server flavour, LVO -138) --------------------------
#
# Flushes the client-side cmdbuf to the Cruth Gleas via PutMsg; the
# Gleas runs the GPU command stream (or Sciath rasteriser) to
# completion and, when the RT is the active screen, vsync-swaps. One
# PutMsg+WaitPort round-trip per frame.

Present           void          (rt:Cruth_Handle)                                       -138  server     Cruth_Server::Present
