# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS iffparse.library .conf — V36+ iffparse.library function table.
# Design: docs/IFFPARSE.md. iffparse parses kernel-side over a dos
# FileHandle, so every implemented LVO is `syscall`: each points at a
# trampoline in src/croi/iffparse/trampolines.S that ecalls into Croi; the
# dispatcher (src/croi/syscall/syscall.c) routes the SYS_Iff_* (cara/
# sysno.h) to the matching Croi_Iff_*_Impl, which reads/writes via the dos
# impls and keeps the IFFHandle + context stack in the SASOS shared heap.
#
# This is L10.1: the library + the handle lifecycle (AllocIFF/FreeIFF,
# InitIFFasDOS, OpenIFF/CloseIFF). ParseIFF + the read walk (L10.2), the
# write side (L10.3), and props/collections/context-items (L10.4) arrive
# later; the surface is declared out to OpenClipboard (-234) with pads the
# later slices split. (GoodID/GoodType/IDtoStr are <libraries/iffparse.h>
# header inlines, not LVOs.)
#
# LVO offsets are the canonical V36+ values from iffparse_lib.fd
# (cross-check amiga_docs/, never copy). The generator validates lvo ==
# -(bias + user_idx*6), so the ##pad_run counts keep declaration order
# aligned with the canonical numbers.

##library    iffparse.library
##base       IFFParseBase
##base_type  IFFParseBase
##bias       30
##owner      croi/iffparse
##spdx       BSD-2-Clause
##include    <libraries/iffparse.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Iff_Open
Close    void              (base:struct Library *)   -12  local   Croi_Iff_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Iff_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Iff_ExtFunc

# ---- AllocIFF / OpenIFF (LVOs -30..-36, ord 4..5) ----------------
# L10.1.
AllocIFF struct IFFHandle *  ()  -30  syscall  Cara_Trampoline_Iff_AllocIFF
OpenIFF  LONG  (iff:struct IFFHandle *, rwMode:LONG)  -36  syscall  Cara_Trampoline_Iff_OpenIFF

# ---- ParseIFF at LVO -42 (ord 6) — pad (L10.2) ------------------
##pad_run 1

# ---- CloseIFF / FreeIFF (LVOs -48..-54, ord 7..8) ---------------
# L10.1.
CloseIFF void  (iff:struct IFFHandle *)  -48  syscall  Cara_Trampoline_Iff_CloseIFF
FreeIFF  void  (iff:struct IFFHandle *)  -54  syscall  Cara_Trampoline_Iff_FreeIFF

# ---- LVOs -60..-216 (ord 9..35) — pad -----------------------------
# ReadChunkBytes/WriteChunkBytes/ReadChunkRecords/WriteChunkRecords/
# PushChunk/PopChunk/EntryHandler/ExitHandler/PropChunk(s)/
# CollectionChunk(s)/StopChunk(s)/StopOnExit/FindProp/FindCollection/
# CurrentChunk/ParentChunk/AllocLocalItem/LocalItemData/SetLocalItemPurge/
# FreeLocalItem/FindLocalItem/StoreLocalItem/StoreItemInContext/InitIFF
# arrive in L10.2-L10.4 (or stay stubbed).
##pad_run 27

# ---- InitIFFasDOS at LVO -222 (ord 36) -------------------------
# L10.1. Bind the handle to a dos FileHandle stream (the only v0 stream).
InitIFFasDOS void  (iff:struct IFFHandle *)  -222  syscall  Cara_Trampoline_Iff_InitIFFasDOS

# ---- LVOs -228..-234 (ord 37..38) — pad -------------------------
# InitIFFasClip / OpenClipboard — deferred with the clipboard.
##pad_run 2
