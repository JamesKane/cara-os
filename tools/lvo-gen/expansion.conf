# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS expansion.library .conf — V36+ expansion.library function table.
# Design: docs/EXPANSION.md. CaraOS has no Zorro bus, so the FDT/PCI boot
# inventory (g_pci_inv, filled by Croi_Pci_Init) IS the AutoConfig chain:
# each PciFunction is presented as a ConfigDev. L14.1 implements the
# ConfigDev list ops (`syscall`); the Zorro board-config / expansion-memory
# / binding / DOS-boot-node LVOs are stubbed (no Zorro; CaraFS mounts over
# NVMe at boot). Each implemented LVO points at a trampoline in
# src/croi/expansion/trampolines.S that ecalls into Croi; the dispatcher
# (src/croi/syscall/syscall.c) routes the SYS_Exp_* (cara/sysno.h) to the
# matching Croi_Exp_*_Impl, which keeps the ConfigDev list in the SASOS
# shared heap.
#
# NOTE: expansion_lib.fd is the ALPHABETICALLY-ORDERED FD (a known quirk),
# so the ConfigDev list ops are scattered, not contiguous; ##pad_run covers
# the stubbed gaps between them. LVO offsets are the canonical V36+ values
# (cross-check amiga_docs/, never copy); the generator validates lvo ==
# -(bias + user_idx*6).

##library    expansion.library
##base       ExpansionBase
##base_type  ExpansionBase
##bias       30
##owner      croi/expansion
##spdx       BSD-2-Clause
##include    <libraries/configvars.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Exp_Open
Close    void              (base:struct Library *)   -12  local   Croi_Exp_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Exp_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Exp_ExtFunc

# ---- AddConfigDev at LVO -30 (user_idx 0) ----------------------------
# L14.1. Append a ConfigDev to the system board list.
AddConfigDev  void  (configDev:struct ConfigDev *)  -30  syscall  Cara_Trampoline_Exp_AddConfigDev

# ---- LVOs -36..-42 (user_idx 1..2) — pad -----------------------------
# AddBootNode -36 (boot node, stub) / AllocBoardMem -42 (Zorro mem, stub).
##pad_run 2

# ---- AllocConfigDev at LVO -48 (user_idx 3) --------------------------
# L14.1. Allocate a zeroed ConfigDev on the shared heap.
AllocConfigDev  struct ConfigDev *  ()  -48  syscall  Cara_Trampoline_Exp_AllocConfigDev

# ---- LVOs -54..-66 (user_idx 4..6) — pad -----------------------------
# AllocExpansionMem -54 (Zorro mem) / ConfigBoard -60 / ConfigChain -66
# (Zorro config) — all stub.
##pad_run 3

# ---- FindConfigDev at LVO -72 (user_idx 7) ---------------------------
# L14.1. Find the next board matching (manufacturer, product); -1 wildcard.
FindConfigDev  struct ConfigDev *  (oldConfigDev:struct ConfigDev *, manufacturer:LONG, product:LONG)  -72  syscall  Cara_Trampoline_Exp_FindConfigDev

# ---- FreeBoardMem at LVO -78 (user_idx 8) — pad (Zorro mem, stub) ----
##pad_run 1

# ---- FreeConfigDev at LVO -84 (user_idx 9) ---------------------------
# L14.1. Free a ConfigDev allocation.
FreeConfigDev  void  (configDev:struct ConfigDev *)  -84  syscall  Cara_Trampoline_Exp_FreeConfigDev

# ---- LVOs -90..-126 (user_idx 10..16) — pad --------------------------
# FreeExpansionMem -90 (Zorro mem) / GetCurrentBinding -96 (binding) /
# MakeDosNode -102 (boot node) / ObtainConfigBinding -108 (binding) /
# ReadExpansionByte -114 / ReadExpansionRom -120 (Zorro config) /
# ReleaseConfigBinding -126 (binding) — all stub.
##pad_run 7

# ---- RemConfigDev at LVO -132 (user_idx 17) --------------------------
# L14.1. Unlink a ConfigDev from the system board list.
RemConfigDev  void  (configDev:struct ConfigDev *)  -132  syscall  Cara_Trampoline_Exp_RemConfigDev

# ---- LVOs -138..-150 (user_idx 18..20) — pad -------------------------
# SetCurrentBinding -138 (binding) / WriteExpansionByte -144 (Zorro config)
# / AddDosNode -150 (boot node, V36) — all stub.
##pad_run 3
