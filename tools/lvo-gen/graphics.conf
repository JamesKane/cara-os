# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS graphics.library .conf — V36+ graphics.library function table.
#
# Owned by Dath (src/croi/dath, the CPU rasteriser). The design is
# docs/DATH_GRAPHICS.md: the V36 RastPort/BitMap drawing model marshalled
# onto the existing Dath_* primitives. Drawing + allocation LVOs are
# `syscall` flavour (the rasteriser runs kernel-side, in place — §2.2),
# arriving with later L4 slices; the reserved slots 0..3 are `local`.
#
# This is L4.1 (docs/DATH_GRAPHICS.md §5): the library is constructed at
# boot with the reserved hooks only — every user-callable slot is a
# ##pad_run placeholder (Croi_LvoUnimplemented) until later slices land
# the real rows. The ABI surface is declared out to FreeBitMap (-924, the
# deepest LVO L4 implements; AllocBitMap/FreeBitMap are V39 LVOs adopted
# for the chunky/RTG bitmap model — see §2.1), so subsequent slices just
# split this pad at the right ordinals.
#
# LVO offsets are the canonical V36+ values from graphics_lib.fd / the
# 3rd Edition autodocs (the generated KB markdown is lost — read
# amiga_docs/ to cross-check, never copy). The generator validates
# lvo == -(bias + user_idx*6), so the ##pad_run count keeps declaration
# order aligned with the canonical numbers.

##library    graphics.library
##base       GfxBase
##base_type  GfxBase
##bias       30
##owner      croi/dath
##spdx       BSD-2-Clause
##include    <graphics/gfxbase.h>
##include    <graphics/gfx.h>
##include    <graphics/rastport.h>
##include    <graphics/text.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local      Croi_Gfx_Open
Close    void              (base:struct Library *)   -12  local      Croi_Gfx_Close
Expunge  void              (base:struct Library *)   -18  local      Croi_Gfx_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local      Croi_Gfx_ExtFunc

# ---- BltBitMap at LVO -30 (ord 4) -----------------------------------
# L4.4. 11-arg V36 blit — too wide for the 7-register syscall ABI (the
# trampoline needs a7 for the syscall number), so it's `local`: a thin
# marshalling stub in the .lib_text.graphics RX page packs the args into
# a GfxBltArgs and makes one ecall (docs/DATH_GRAPHICS.md). Plain copy in
# v0 (minterm/mask/tempA ignored; Dath_BlitRect over the chunky surfaces).
BltBitMap  LONG  (srcBitMap:const struct BitMap *, xSrc:WORD, ySrc:WORD, destBitMap:struct BitMap *, xDest:WORD, yDest:WORD, xSize:WORD, ySize:WORD, minterm:UBYTE, mask:UBYTE, tempA:PLANEPTR)  -30  local  Croi_Gfx_BltBitMap

# ---- LVOs -36..-48 (ord 5..7) — pad ---------------------------------
##pad_run 3

# ---- Text + fonts (LVOs -54..-78, ord 8..12) ------------------------
# L4.5. `syscall`: TextLength/Text render the Dath 8x8 font into the
# RastPort's surface (Dath_DrawChar); OpenFont returns the single v0
# system font (a TextFont over dath_font_8x8), SetFont binds rp.Font,
# CloseFont is a no-op. docs/DATH_GRAPHICS.md §5.
TextLength  LONG  (rp:struct RastPort *, string:STRPTR, count:ULONG)  -54  syscall  Cara_Trampoline_GfxTextLength
Text        void  (rp:struct RastPort *, string:STRPTR, count:ULONG)  -60  syscall  Cara_Trampoline_GfxText
SetFont     void  (rp:struct RastPort *, textFont:struct TextFont *)  -66  syscall  Cara_Trampoline_GfxSetFont
OpenFont    struct TextFont *  (textAttr:struct TextAttr *)           -72  syscall  Cara_Trampoline_GfxOpenFont
CloseFont   void  (textFont:struct TextFont *)                        -78  syscall  Cara_Trampoline_GfxCloseFont

# ---- LVOs -84..-192 (ord 13..31) — pad before InitRastPort ----------
##pad_run 19

# ---- InitRastPort at LVO -198 (ord 32) ------------------------------
# L4.2. `syscall`: zero the caller's RastPort + set V36 defaults
# (FgPen 1, BgPen 0, JAM2, the GfxBase default font). No Dath call.
InitRastPort  void  (rp:struct RastPort *)                    -198 syscall  Cara_Trampoline_GfxInitRastPort

# ---- LVOs -204..-228 (ord 33..37) — pad before SetRast --------------
##pad_run 5

# ---- SetRast at LVO -234 (ord 38) -----------------------------------
# L4.2. `syscall`: Dath_Clear the RastPort's BitMap surface with `pen`
# (resolved through the v0 default palette to the surface format).
SetRast       void  (rp:struct RastPort *, pen:ULONG)         -234 syscall  Cara_Trampoline_GfxSetRast

# ---- Move / Draw (LVOs -240..-246, ord 39..40) ----------------------
# L4.3. Move sets the RastPort graphics cursor; Draw lines from it to
# (x,y) in FgPen and updates the cursor (Dath_DrawLine).
Move  void  (rp:struct RastPort *, x:WORD, y:WORD)            -240 syscall  Cara_Trampoline_GfxMove
Draw  void  (rp:struct RastPort *, x:WORD, y:WORD)            -246 syscall  Cara_Trampoline_GfxDraw

# ---- Area* polygon fill (LVOs -252..-264, ord 41..43) ---------------
# L4.6. AreaMove/AreaDraw accumulate vertices into rp->AreaInfo;
# AreaEnd scanline-fills the polygon(s) in FgPen (docs/DATH_GRAPHICS.md
# §5/§6.3). `syscall`.
AreaMove  LONG  (rp:struct RastPort *, x:WORD, y:WORD)        -252 syscall  Cara_Trampoline_GfxAreaMove
AreaDraw  LONG  (rp:struct RastPort *, x:WORD, y:WORD)        -258 syscall  Cara_Trampoline_GfxAreaDraw
AreaEnd   LONG  (rp:struct RastPort *)                        -264 syscall  Cara_Trampoline_GfxAreaEnd

# ---- LVOs -270..-276 (ord 44..45) — pad (WaitTOF, QBlit) -----------
##pad_run 2

# ---- InitArea at LVO -282 (ord 46) ----------------------------------
# L4.6. Bind a caller vertex buffer to an AreaInfo (5 bytes/vector).
InitArea  void  (areaInfo:struct AreaInfo *, vectorBuffer:APTR, maxVectors:WORD)  -282 syscall  Cara_Trampoline_GfxInitArea

# ---- LVOs -288..-300 (ord 47..49) — pad ----------------------------
##pad_run 3

# ---- RectFill at LVO -306 (ord 50) ----------------------------------
# L4.3. Filled rectangle, inclusive corners, in FgPen (Dath_FillRect).
RectFill  void  (rp:struct RastPort *, xMin:WORD, yMin:WORD, xMax:WORD, yMax:WORD)  -306 syscall  Cara_Trampoline_GfxRectFill

# ---- LVO -312 (ord 51) — pad (BltPattern) --------------------------
##pad_run 1

# ---- ReadPixel / WritePixel (LVOs -318..-324, ord 52..53) ----------
# L4.3. WritePixel sets (x,y) to FgPen (Dath_Pixel) → 0 ok / -1 OOB.
# ReadPixel returns the raw chunky pixel value (v0: no reverse-palette
# lookup) or -1 OOB.
ReadPixel   LONG  (rp:struct RastPort *, x:WORD, y:WORD)      -318 syscall  Cara_Trampoline_GfxReadPixel
WritePixel  LONG  (rp:struct RastPort *, x:WORD, y:WORD)      -324 syscall  Cara_Trampoline_GfxWritePixel

# ---- LVOs -330..-336 (ord 54..55) — pad (Flood, PolyDraw) ----------
##pad_run 2

# ---- SetAPen / SetBPen / SetDrMd (LVOs -342..-354, ord 56..58) ------
# L4.3. Pen + draw-mode state on the RastPort (no Dath call).
SetAPen  void  (rp:struct RastPort *, pen:ULONG)              -342 syscall  Cara_Trampoline_GfxSetAPen
SetBPen  void  (rp:struct RastPort *, pen:ULONG)              -348 syscall  Cara_Trampoline_GfxSetBPen
SetDrMd  void  (rp:struct RastPort *, mode:ULONG)             -354 syscall  Cara_Trampoline_GfxSetDrMd

# ---- LVOs -360..-546 (ord 59..90) — pad (ScrollRaster -396 deferred) -
##pad_run 32

# ---- ClipBlit at LVO -552 (ord 91) ----------------------------------
# L4.4. RastPort→RastPort blit. `local` (9 args > 7-reg syscall): the
# stub resolves both RastPorts' BitMaps and shares the GfxBltArgs ecall.
# v0 clips to the BitMap rect (no layer/clip regions yet — §6.4).
ClipBlit  void  (srcRP:struct RastPort *, xSrc:WORD, ySrc:WORD, destRP:struct RastPort *, xDest:WORD, yDest:WORD, xSize:WORD, ySize:WORD, minterm:UBYTE)  -552  local  Croi_Gfx_ClipBlit

# ---- LVOs -558..-600 (ord 92..99) — pad ----------------------------
##pad_run 8

# ---- BltBitMapRastPort at LVO -606 (ord 100) ------------------------
# L4.4. BitMap→RastPort blit. `local` (9 args); same shared ecall.
BltBitMapRastPort  void  (srcBitMap:struct BitMap *, xSrc:WORD, ySrc:WORD, destRP:struct RastPort *, xDest:WORD, yDest:WORD, xSize:WORD, ySize:WORD, minterm:UBYTE)  -606  local  Croi_Gfx_BltBitMapRastPort

# ---- LVOs -612..-912 (ord 101..151) — pad before AllocBitMap --------
# Filled later: text/font rows, ScrollRaster, etc.
##pad_run 51

# ---- AllocBitMap / FreeBitMap (LVOs -918..-924, ord 152..153) -------
# L4.2. V39 LVOs adopted for the chunky/RTG bitmap model (§2.1).
# `syscall`: allocate a chunky DathFramebuffer in the shared heap wrapped
# in a DathBitMapExt; the returned BitMap * is U-mode-readable.
AllocBitMap   struct BitMap *  (sizex:ULONG, sizey:ULONG, depth:ULONG, flags:ULONG, friend_bitmap:const struct BitMap *)  -918 syscall  Cara_Trampoline_GfxAllocBitMap
FreeBitMap    void             (bm:struct BitMap *)            -924 syscall  Cara_Trampoline_GfxFreeBitMap
