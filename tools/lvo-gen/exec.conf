# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS exec.library .conf — V36+ exec.library function table.
#
# Reserved 0..3 are local-flavour stubs in src/croi/exec_lib/exec_hooks.c.
# User-defined slots that we implement are syscall flavour, pointing at
# the per-LVO trampolines in src/croi/exec_lib/trampolines.S; the kernel
# dispatcher (src/croi/syscall/syscall.c) routes by SYS_* (cara/sysno.h)
# to the matching Croi_*_Impl helper.
#
# Slots not yet implemented are explicit ##pad_run runs — each fills
# the matching number of canonical V36+ LVOs with Croi_LvoUnimplemented.
# Phase 3 fills in more rows over time. The total row count must reach
# OpenLibrary at -552 so the inline stub from <proto/exec.h> indexes a
# real vec entry.

##library    exec.library
##base       SysBase
##base_type  ExecBase
##bias       30
##owner      croi/exec_lib
##spdx       BSD-2-Clause
##include    <exec/lists.h>
##include    <exec/memory.h>
##include    <exec/ports.h>
##include    <exec/tasks.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)              -6   local      Croi_Exec_Open
Close    void              (base:struct Library *)              -12  local      Croi_Exec_Close
Expunge  void              (base:struct Library *)              -18  local      Croi_Exec_Expunge
ExtFunc  ULONG             (base:struct Library *)              -24  local      Croi_Exec_ExtFunc

# ---- LVOs -30..-192 (ord 4..31) — pad before AllocMem at -198 -------
##pad_run 28

# ---- AllocMem at LVO -198 (ord 32) -----------------------------------
AllocMem APTR              (size:ULONG, flags:ULONG)            -198 syscall    Cara_Trampoline_AllocMem

# ---- LVO -204 (ord 33) — pad ----------------------------------------
##pad_run 1

# ---- FreeMem at LVO -210 (ord 34) ------------------------------------
FreeMem  void              (addr:APTR, size:ULONG)              -210 syscall    Cara_Trampoline_FreeMem

# ---- LVOs -216..-228 (ord 35..37) — pad before Insert --------------
##pad_run 3

# ---- Exec list primitives (LVOs -234..-276, ord 38..45) ------------
# The first U-mode-callable `local` LVOs: pure pointer manipulation on
# the caller's struct List / struct Node (SASOS-resident), so no
# syscall. The impls live in src/croi/exec_lib/list_ops.c, placed in
# the .lib_text.exec RX page (LVO.md §5.1). The generated stub appends
# SysBase as the trailing arg, which the impls ignore.
Insert   void           (list:struct List *, node:struct Node *, pred:struct Node *) -234 local Croi_Exec_Insert
AddHead  void           (list:struct List *, node:struct Node *)            -240 local Croi_Exec_AddHead
AddTail  void           (list:struct List *, node:struct Node *)            -246 local Croi_Exec_AddTail
Remove   void           (node:struct Node *)                                -252 local Croi_Exec_Remove
RemHead  struct Node *  (list:struct List *)                                -258 local Croi_Exec_RemHead
RemTail  struct Node *  (list:struct List *)                                -264 local Croi_Exec_RemTail
Enqueue  void           (list:struct List *, node:struct Node *)            -270 local Croi_Exec_Enqueue
FindName struct Node *  (list:struct List *, name:STRPTR)                    -276 local Croi_Exec_FindName

# ---- LVOs -282..-300 (ord 46..49) — pad before SetSignal ----------
##pad_run 4

# ---- SetSignal at LVO -306 (ord 50) ----------------------------------
SetSignal ULONG            (new_signals:ULONG, mask:ULONG)      -306 syscall    Cara_Trampoline_SetSignal

# ---- LVO -312 (ord 51) — V36+ SetExcept, not implemented ------------
##pad_run 1

# ---- Wait/Signal/AllocSignal/FreeSignal (LVOs -318..-336, ord 52..55)
Wait        ULONG          (mask:ULONG)                         -318 syscall    Cara_Trampoline_Wait
Signal      void           (target:struct Task *, mask:ULONG)   -324 syscall    Cara_Trampoline_Signal
AllocSignal LONG           (sig_num:LONG)                       -330 syscall    Cara_Trampoline_AllocSignal
FreeSignal  void            (sig_num:LONG)                      -336 syscall    Cara_Trampoline_FreeSignal

# ---- LVOs -342..-360 (ord 56..59) — pad before PutMsg --------------
##pad_run 4

# ---- PutMsg/GetMsg at LVOs -366/-372 (ord 60..61) -------------------
PutMsg   void              (port:struct MsgPort *, msg:struct Message *) -366 syscall   Cara_Trampoline_PutMsg
GetMsg   struct Message *  (port:struct MsgPort *)              -372 syscall    Cara_Trampoline_GetMsg

# ---- LVO -378 (ord 62) — V36+ ReplyMsg, not implemented -------------
##pad_run 1

# ---- WaitPort at LVO -384 (ord 63) -----------------------------------
WaitPort struct Message *  (port:struct MsgPort *)              -384 syscall    Cara_Trampoline_WaitPort

# ---- LVOs -390..-402 (ord 64..66) — pad before OldOpenLibrary ------
##pad_run 3

# ---- OldOpenLibrary/CloseLibrary (LVOs -408/-414, ord 67..68) -------
OldOpenLibrary struct Library *  (name:STRPTR)                  -408 syscall    Cara_Trampoline_OldOpenLibrary
CloseLibrary   void              (lib:struct Library *)         -414 syscall    Cara_Trampoline_CloseLibrary

# ---- LVOs -420..-546 (ord 69..90) — pad before OpenLibrary ---------
##pad_run 22

# ---- OpenLibrary at LVO -552 (ord 91) --------------------------------
OpenLibrary    struct Library *  (name:STRPTR, version:ULONG)   -552 syscall    Cara_Trampoline_OpenLibrary
