# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS dos.library .conf — V36+ dos.library (AmigaDOS) function table.
#
# Owned by Logaic (the brand that also owns CaraFS + the boot path). The
# design is docs/LOGAIC_DOS.md: a U-mode handler Gleas receives DosPackets
# and reaches CaraFS via handler-only kernel FS syscalls; the file/lock/
# dir LVOs are `server` flavour (PutMsg round-trip). The non-packet bits
# (IoErr/SetIoErr) read/write the caller's Process and are `syscall`.
#
# This is L3.1 (docs/LOGAIC_DOS.md §5): the ABI is declared up to IoErr
# (-132), which is the only implemented row; everything before it is
# ##pad_run filling the canonical V36+ slots (Open -30 … CurrentDir -126)
# until later slices land them. NOTE: dos.library's file Open() is at
# LVO -30 and collides with lvo-gen's reserved-slot name "Open"; it stays
# a pad until L3.4, when lvo-gen's reserved-slot naming gets disambiguated
# (a known follow-up — see docs/LOGAIC_DOS.md).
#
# LVO offsets are the canonical V36+ values from dos_lib.fd / the 3rd
# Edition autodocs. The generator validates lvo == -(bias + user_idx*6),
# so the ##pad_run counts keep declaration order aligned with -132.

##library    dos.library
##base       DOSBase
##base_type  DosLibrary
##bias       30
##owner      logaic/dos
##spdx       BSD-2-Clause
##include    <dos/dos.h>
##include    <dos/dosextens.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local      Croi_Dos_Open
Close    void              (base:struct Library *)   -12  local      Croi_Dos_Close
Expunge  void              (base:struct Library *)   -18  local      Croi_Dos_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local      Croi_Dos_ExtFunc

# ---- LVOs -30..-126 (ord 4..20) — pad before IoErr -------------------
# The classic dos call block: Open, Close, Read, Write, Input, Output,
# Seek, DeleteFile, Rename, Lock, UnLock, DupLock, Examine, ExNext, Info,
# CreateDir, CurrentDir. Filled by L3.3+ (file Open at -30 also needs the
# reserved-name disambiguation noted above).
##pad_run 17

# ---- IoErr at LVO -132 (ord 21) --------------------------------------
# Returns the caller Process's pr_Result2. `syscall` (the kernel reads
# Sched_Current; no U-mode ThisTask global yet — see docs/LOGAIC_DOS.md
# §2.2, can become `local` once ExecBase->ThisTask is maintained).
IoErr    LONG              ()                        -132 syscall    Cara_Trampoline_DosIoErr
