# SPDX-License-Identifier: BSD-2-Clause
#
# CaraOS icon.library .conf — V36+ icon.library function table.
# Design: docs/ICON.md. icon.library parses an object's `cara.icon` xattr
# (CARAFS §3.10) into a struct DiskObject — CaraOS keeps no sibling
# `.info` files. The DiskObject-lifecycle LVOs are `syscall`: each points
# at a trampoline in src/croi/icon/trampolines.S that ecalls into Croi;
# the dispatcher (src/croi/syscall/syscall.c) routes the SYS_Icon_*
# (cara/sysno.h) to the matching Croi_Icon_*_Impl, which reads/writes the
# xattr via Carafs_Xattr* and keeps the DiskObject in the SASOS shared
# heap. The pure-string helpers (FindToolType/MatchToolValue/BumpRevision)
# are `local` flavour and arrive in L11.3.
#
# This is L11.1: the library + the read path (GetDiskObject/FreeDiskObject)
# over a new CaraFS inline xattr layer. The write side + defaults (L11.2)
# and the tool-type helpers (L11.3) split the pads below.
#
# LVO offsets are the canonical V36+ values from icon_lib.fd (cross-check
# amiga_docs/, never copy). The generator validates lvo == -(bias +
# user_idx*6), so the ##pad_run counts keep declaration order aligned with
# the canonical numbers. The legacy freelist API (GetWBObject/PutWBObject/
# GetIcon/PutIcon/FreeFreeList/AddFreeList) and the two private slots stay
# padded permanently — no modern caller, and CaraOS hands back single
# shared-heap DiskObjects with no caller-visible FreeList.

##library    icon.library
##base       IconBase
##base_type  IconBase
##bias       30
##owner      croi/icon
##spdx       BSD-2-Clause
##include    <workbench/workbench.h>

# ---- Reserved slots 0..3 (LVOs -6..-24) ------------------------------
Open     struct Library *  (base:struct Library *)   -6   local   Croi_Icon_Open
Close    void              (base:struct Library *)   -12  local   Croi_Icon_Close
Expunge  void              (base:struct Library *)   -18  local   Croi_Icon_Expunge
ExtFunc  ULONG             (base:struct Library *)   -24  local   Croi_Icon_ExtFunc

# ---- LVOs -30..-66 (user_idx 0..6) — pad -----------------------------
# Legacy freelist API: GetWBObject -30 / PutWBObject -36 / GetIcon -42 /
# PutIcon -48 / FreeFreeList -54 (stubbed, no modern caller) + 2 private
# slots (-60, -66).
##pad_run 7

# ---- GetDiskObject at LVO -72 (user_idx 7) ---------------------------
# L11.1. Resolve `name`, parse its cara.icon xattr → struct DiskObject.
GetDiskObject  struct DiskObject *  (name:STRPTR)  -72  syscall  Cara_Trampoline_Icon_GetDiskObject

# ---- PutDiskObject at LVO -78 (user_idx 8) — pad (L11.2) -------------
##pad_run 1

# ---- FreeDiskObject at LVO -84 (user_idx 9) --------------------------
# L11.1. Free the single shared-heap DiskObject allocation.
FreeDiskObject  void  (diskobj:struct DiskObject *)  -84  syscall  Cara_Trampoline_Icon_FreeDiskObject

# ---- LVOs -90..-138 (user_idx 10..18) — pad --------------------------
# FindToolType -90 / MatchToolValue -96 / BumpRevision -102 (local,
# L11.3); 1 private slot (-108); GetDiskObjectNew -114 / DeleteDiskObject
# -120 (L11.2); AddFreeList -126 (stub); GetDefDiskObject -132 /
# PutDefDiskObject -138 (L11.2).
##pad_run 9
